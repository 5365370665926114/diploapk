name: DiploCine APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'diplocine/**'
      - '.github/workflows/diplocine-apk.yml'
  pull_request:
    paths:
      - 'diplocine/**'
      - '.github/workflows/diplocine-apk.yml'

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      DIPLOCINE_SITE_URL: ${{ vars.DIPLOCINE_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p diplocine :app:assembleDebug --stacktrace
      - name: Package test APK
        run: cp diplocine/app/build/outputs/apk/debug/app-debug.apk DiploCine-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DiploCine-debug
          path: DiploCine-debug.apk
