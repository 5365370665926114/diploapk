name: DiploCine APK
on:
  workflow_dispatch:
  push:
    branches: [feature/diplocine-android]

permissions:
  contents: read

concurrency:
  group: diplocine-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble original OwnTV app
        env:
          VERSION_NAME: '0.2.0'
          VERSION_CODE: '100000'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug --stacktrace
      - name: Package test APK
        run: cp app/build/outputs/apk/standard/debug/*.apk DiploCine-OwnTV-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: DiploCine-OwnTV-debug
          path: DiploCine-OwnTV-debug.apk
